<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approve KYC</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.6.1/dist/web3.min.js"></script>
  <link rel="stylesheet" href="approveKYC.css"/>

</head>
<body>
    <div class="container">
  <h1>Approve KYC</h1>

  <button id="rejectKYCButton">Reject KYC</button>

  <h3>Status:</h3>
  <p id="status"></p>
</div>

</body>
