<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request KYC</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.6.1/dist/web3.min.js"></script>
  <link rel="stylesheet" href="requestKYC.css"/>
</head>
<body>
    
  
<div class="container">
  <form id="kycForm">
    <h1>Request KYC</h1>
    <label for="name">Name:</label><br>
    <input type="text" id="name" required><br><br>

    <label for="age">Age:</label><br>
    <input type="number" id="age" required><br><br>

    <label for="userId">User ID (Email):</label><br>
    <input type="text" id="userId" required><br><br>

    <label for="image">Upload ID</label>

    <input 
    type="file" 
    accept=".jpg, .jpeg, .png" 
    required class="requestKYC">

    <br><br>

    <button type="submit">Request KYC</button>
  </form>
</div>
<script src="Request.js"></script>
</body>
</html>
